<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening secure payment | Money Mint</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="finance-page"><main class="transaction-detail-shell"><article class="transaction-detail"><header><div><span class="muted-label">SECURE PAYMENT</span><h1>Opening PayU Hosted Checkout…</h1></div></header><p>Your pending transaction has been saved. Do not close this page while you are redirected.</p><form id="payuForm" th:action="${checkout.action}" method="post"><input th:each="field:${checkout.fields}" type="hidden" th:name="${field.key}" th:value="${field.value}"><button class="btn btn-mint" type="submit">Continue to PayU</button></form><p class="mono" th:text="${checkout.transactionId}">Transaction</p></article></main><script>document.getElementById('payuForm').submit();</script></body></html>
