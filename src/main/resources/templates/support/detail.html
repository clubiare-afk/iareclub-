<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${ticket.ticketNumber}+' | Customer Service'">Ticket | FundRise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/premium-ui.css}"><link rel="stylesheet" th:href="@{/css/support.css}"></head>
<body class="finance-page support-page"><aside th:replace="~{fragments/user-sidebar :: sidebar('support')}"></aside><div class="finance-main"><header class="finance-topbar"><button class="mobile-menu" id="mobileMenu"><i data-lucide="menu"></i></button><div><span class="muted-label" th:text="${ticket.ticketNumber}">TICKET</span><h1 th:text="${ticket.title}">Support ticket</h1></div><span class="support-status" th:classappend="${#strings.toLowerCase(#strings.replace(ticket.status.name(),'_','-'))}" th:text="${#strings.replace(ticket.status.name(),'_',' ')}">OPEN</span></header>
<main class="finance-content"><a class="support-back" th:href="@{/support}"><i data-lucide="arrow-left"></i> All tickets</a><div class="notice success" th:if="${success}"><span th:text="${success}"></span></div><div class="notice error" th:if="${error}"><span th:text="${error}"></span></div>
<div class="support-detail-grid"><section class="conversation-panel"><div class="conversation-intro"><span><i data-lucide="circle-user-round"></i></span><div><b>You opened this ticket</b><time th:text="${#temporals.format(ticket.createdAt,'dd MMM yyyy, HH:mm')}">Date</time><p th:text="${ticket.description}">Description</p></div></div>
<div class="support-gallery" th:if="${!#lists.isEmpty(ticket.images)}"><a th:each="image:${ticket.images}" th:href="${image.secureUrl}" target="_blank" rel="noopener"><img th:src="${image.secureUrl}" th:alt="${image.originalName}"><span><i data-lucide="maximize-2"></i></span></a></div>
<div class="conversation-thread"><article th:each="reply:${ticket.messages}" class="support-message" th:classappend="${reply.sender.name()=='ADMIN'}?'admin':'user'"><div class="message-author"><span><i th:data-lucide="${reply.sender.name()=='ADMIN'}?'headphones':'user'"></i></span><b th:text="${reply.sender.name()=='ADMIN'}?'FundRise Support':'You'">Sender</b><time th:text="${#temporals.format(reply.createdAt,'dd MMM, HH:mm')}">Date</time></div><p th:text="${reply.message}">Reply</p></article></div>
<form class="support-reply" th:if="${ticket.status.name()!='CLOSED'}" th:action="@{/support/{id}/replies(id=${ticket.id})}" method="post"><label for="message">Add a reply</label><textarea id="message" name="message" maxlength="5000" required rows="4" placeholder="Write your message…"></textarea><button class="btn btn-mint"><i data-lucide="send"></i> Send reply</button></form><div class="ticket-closed-note" th:if="${ticket.status.name()=='CLOSED'}"><i data-lucide="lock-keyhole"></i><span><b>This ticket is closed</b><small>Create a new ticket if you need more help.</small></span></div></section>
<aside class="ticket-summary"><h3>Ticket details</h3><dl><div><dt>Ticket ID</dt><dd th:text="${ticket.ticketNumber}">ID</dd></div><div><dt>Status</dt><dd th:text="${#strings.replace(ticket.status.name(),'_',' ')}">OPEN</dd></div><div><dt>Created</dt><dd th:text="${#temporals.format(ticket.createdAt,'dd MMM yyyy')}">Date</dd></div><div><dt>Last updated</dt><dd th:text="${#temporals.format(ticket.updatedAt,'dd MMM yyyy, HH:mm')}">Date</dd></div></dl><h4>Status history</h4><ol><li th:each="entry:${ticket.statusHistory}"><span></span><div><b th:text="${#strings.replace(entry.newStatus.name(),'_',' ')}">Status</b><small th:text="${#temporals.format(entry.createdAt,'dd MMM, HH:mm')}">Date</small></div></li></ol></aside></div></main></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
