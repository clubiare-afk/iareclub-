<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Transactions | FundRise</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="admin-page"><aside class="admin-sidebar"><a class="brand" th:href="@{/admin/dashboard}">FundRise</a><div class="console-label">ADMIN CONSOLE</div><nav><a th:href="@{/admin/dashboard}">Overview</a><a th:href="@{/admin/payment-settings}">Payment Settings</a><a class="active" th:href="@{/admin/payment-transactions}">Payment Transactions</a><a th:href="@{/admin/deposits}">Legacy PayU Records</a></nav></aside><div class="admin-main"><header class="admin-topbar"><div><span class="muted-label">YOUPI-PG OPERATIONS</span><h1>Payment Transactions</h1></div></header><main class="admin-content"><div class="notice success" th:if="${success}" th:text="${success}"></div><div class="notice error" th:if="${error}" th:text="${error}"></div><section class="admin-panel"><form class="admin-filters" method="get"><input name="q" th:value="${q}" placeholder="User, order, YouPI ID or UTR"><select name="status"><option value="">All states</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==selectedStatus}"></option></select><button class="btn btn-dark-mint">Search</button></form><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Order / YouPI</th><th>User</th><th>Amount / destination</th><th>Status</th><th>Detection</th><th>Authorized reconciliation</th></tr></thead><tbody><tr th:each="p:${page.content}"><td><b class="mono" th:text="${p.reference}"></b><small class="mono" th:text="${p.youpiPaymentId==null?'Local fallback':p.youpiPaymentId}"></small></td><td><b th:text="${p.user.fullName}"></b><small th:text="${p.user.email}"></small></td><td><b th:text="'₹'+${#numbers.formatDecimal(p.amount,1,2)}"></b><small class="mono" th:text="${p.merchantUpiId}"></small></td><td><span class="tx-status" th:classappend="${p.status.name().toLowerCase()}" th:text="${p.status}"></span><small th:text="${p.gatewayStatus==null?'—':p.gatewayStatus}"></small></td><td><span th:text="${p.provider==null?'No signal':p.provider}"></span><small th:text="${p.bankReference==null?'No UTR':p.bankReference}"></small></td><td><form th:if="${p.status.name()!='COMPLETED'}" method="post" th:action="@{/admin/payment-transactions/{id}/verify(id=${p.id})}"><input name="providerTransactionId" required placeholder="Provider transaction ID"><input name="utr" required placeholder="Verified UTR"><input name="evidence" required minlength="10" placeholder="Official statement row/date and review note"><button class="btn btn-mint">Verify &amp; credit</button></form><span th:if="${p.status.name()=='COMPLETED'}">Wallet credited</span></td></tr><tr th:if="${page.empty}"><td colspan="6">No matching payment requests.</td></tr></tbody></table></div><div class="pagination-row" th:if="${page.totalPages>1}"><a th:if="${page.hasPrevious()}" th:href="@{/admin/payment-transactions(page=${page.number-1},q=${q},status=${selectedStatus})}">Previous</a><span th:text="'Page '+${page.number+1}+' of '+${page.totalPages}"></span><a th:if="${page.hasNext()}" th:href="@{/admin/payment-transactions(page=${page.number+1},q=${q},status=${selectedStatus})}">Next</a></div></section></main></div></body></html>
