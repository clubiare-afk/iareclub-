<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${product.name}+' | Money Mint Admin'">Product</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="admin-page product-view-page"><div class="product-view-shell"><a class="admin-back-link" th:href="@{/admin/dashboard#products}"><i data-lucide="arrow-left"></i> Back to products</a><article class="product-view-card"><div class="product-view-image"><img th:src="${product.imageUrl}" th:alt="${product.name}"><span class="table-status" th:classappend="${product.active}?'active':'inactive'" th:text="${product.active}?'Active':'Inactive'">Active</span></div><div class="product-view-content"><span class="kicker">INVESTMENT PRODUCT</span><h1 th:text="${product.name}">Product</h1><div class="view-price"><del th:text="'₹'+${#numbers.formatDecimal(product.originalPrice,1,2)}">₹0</del><strong th:text="'₹'+${#numbers.formatDecimal(product.discountPrice,1,2)}">₹0</strong><span>investment amount</span></div><div class="view-metrics"><div><i data-lucide="calendar-plus"></i><span>Daily reward<b th:text="'₹'+${#numbers.formatDecimal(product.dailyEarnings,1,2)}">₹0</b></span></div><div><i data-lucide="calendar-days"></i><span>Duration<b th:text="${product.totalDays}+' days'">0 days</b></span></div><div><i data-lucide="chart-no-axes-combined"></i><span>Projected returns<b th:text="'₹'+${#numbers.formatDecimal(product.totalReturns,1,2)}">₹0</b></span></div><div><i data-lucide="trending-up"></i><span>Projected net profit<b th:text="'₹'+${#numbers.formatDecimal(product.netProfit,1,2)}">₹0</b></span></div></div><p class="projection-note"><i data-lucide="info"></i> Returns are projections for demonstration and are not guaranteed.</p><div class="view-actions"><a class="btn btn-mint" th:href="@{/admin/products/{id}/edit(id=${product.id})}"><i data-lucide="pencil"></i> Edit product</a><form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"><button class="btn btn-danger-soft"><i data-lucide="trash-2"></i> Delete</button></form></div></div></article></div><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
