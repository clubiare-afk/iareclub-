<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${ticket.ticketNumber}+' | FundRise Support'">Support ticket</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/support.css}"></head>
<body class="admin-page support-admin"><aside class="admin-sidebar" id="sidebar"><a class="brand" th:href="@{/admin/dashboard}"><span class="brand-mark"><i data-lucide="sprout"></i></span><span>FundRise</span></a><div class="console-label">ADMIN CONSOLE</div><nav><a th:href="@{/admin/dashboard}"><i data-lucide="layout-dashboard"></i> Overview</a><a class="active" th:href="@{/admin/support}"><i data-lucide="life-buoy"></i> Customer Support</a></nav><div class="admin-side-foot"><form th:action="@{/admin/logout}" method="post"><button><i data-lucide="log-out"></i> Log out</button></form></div></aside>
<div class="admin-main"><header class="admin-topbar"><button class="mobile-menu" id="mobileMenu"><i data-lucide="menu"></i></button><div><span class="muted-label" th:text="${ticket.ticketNumber}">TICKET</span><h1 th:text="${ticket.title}">Ticket</h1></div><a class="admin-back-link" th:href="@{/admin/support}"><i data-lucide="arrow-left"></i> Support queue</a></header><main class="admin-content"><div class="notice success" th:if="${success}"><span th:text="${success}"></span></div><div class="notice error" th:if="${error}"><span th:text="${error}"></span></div>
<div class="support-detail-grid admin-support-detail"><section class="conversation-panel"><div class="conversation-intro"><span><i data-lucide="circle-user-round"></i></span><div><b th:text="${ticket.user.fullName}">User</b><small th:text="${ticket.user.email}">email</small><time th:text="${#temporals.format(ticket.createdAt,'dd MMM yyyy, HH:mm')}">Date</time><p th:text="${ticket.description}">Description</p></div></div>
<div class="support-gallery" th:if="${!#lists.isEmpty(ticket.images)}"><a th:each="image:${ticket.images}" th:href="${image.secureUrl}" target="_blank" rel="noopener"><img th:src="${image.secureUrl}" th:alt="${image.originalName}"><span><i data-lucide="maximize-2"></i></span></a></div>
<div class="conversation-thread"><article th:each="reply:${ticket.messages}" class="support-message" th:classappend="${reply.sender.name()=='ADMIN'}?'admin':'user'"><div class="message-author"><span><i th:data-lucide="${reply.sender.name()=='ADMIN'}?'headphones':'user'"></i></span><b th:text="${reply.sender.name()=='ADMIN'}?'Support team':${ticket.user.fullName}">Sender</b><time th:text="${#temporals.format(reply.createdAt,'dd MMM, HH:mm')}">Date</time></div><p th:text="${reply.message}">Message</p></article></div>
<form class="support-reply" th:action="@{/admin/support/{id}/replies(id=${ticket.id})}" method="post"><label for="message">Reply to customer</label><textarea id="message" name="message" maxlength="5000" required rows="5" placeholder="Write a clear and helpful response…"></textarea><button class="btn btn-mint"><i data-lucide="send"></i> Send reply</button></form></section>
<aside class="ticket-summary"><span class="support-status" th:classappend="${#strings.toLowerCase(#strings.replace(ticket.status.name(),'_','-'))}" th:text="${#strings.replace(ticket.status.name(),'_',' ')}">OPEN</span><h3>Ticket controls</h3><dl><div><dt>Customer</dt><dd th:text="${ticket.user.fullName}">Name</dd></div><div><dt>Email</dt><dd th:text="${ticket.user.email}">Email</dd></div><div><dt>Ticket ID</dt><dd th:text="${ticket.ticketNumber}">ID</dd></div><div><dt>Created</dt><dd th:text="${#temporals.format(ticket.createdAt,'dd MMM yyyy, HH:mm')}">Date</dd></div></dl>
<form class="status-form" th:action="@{/admin/support/{id}/status(id=${ticket.id})}" method="post"><label for="status">Update status</label><select id="status" name="status"><option th:each="item:${statuses}" th:value="${item}" th:selected="${item==ticket.status}" th:text="${#strings.replace(item.name(),'_',' ')}">Status</option></select><button class="btn btn-dark-mint">Save status</button></form><h4>Status history</h4><ol><li th:each="entry:${ticket.statusHistory}"><span></span><div><b th:text="${#strings.replace(entry.newStatus.name(),'_',' ')}">Status</b><small th:text="${#temporals.format(entry.createdAt,'dd MMM, HH:mm')}">Date</small></div></li></ol></aside></div></main></div><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script th:src="@{/js/app.js}"></script></body></html>
