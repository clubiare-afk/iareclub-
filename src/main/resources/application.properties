spring.application.name=Money Mint
server.port=8080

# Supabase PostgreSQL connection
# Paste the values shown in Supabase: Project Settings > Database > Connection string.
# Use the Session pooler connection when your network requires IPv4.
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.vezwivnbtjjgvbvdlehj
spring.datasource.password=Nandu@Minnu
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.thymeleaf.cache=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Supabase is a remote pooled database. Allow enough time to replace a connection
# when the pooler/network closes one during the relatively long startup sequence.
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.cache.type=caffeine
spring.cache.cache-names=products,activeProducts
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.error.include-message=never

# Admin login at /money. Change these values before deploying publicly.
# The password is BCrypt-encoded in memory before Spring Security uses it.
moneymint.admin.email=admin@gmail.com
moneymint.admin.password=admin@123

# Financial demo mode. Keep disabled in production until a verified payment provider webhook is integrated.
moneymint.demo-payments.enabled=false
moneymint.withdrawal.minimum=100.00
moneymint.reward.period-hours=24
moneymint.referral.bonus=200.00
# Public origin used to build shareable referral links. Override in production.
moneymint.public-base-url=${MONEYMINT_PUBLIC_BASE_URL:${payu.public-base-url:http://localhost:8080}}
# Base64-encoded 32-byte AES key. Override this value in every non-local environment.
moneymint.bank-encryption-key=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
# Reserved for future Razorpay integration. Never expose these values to templates or JavaScript.
razorpay.key-id=
razorpay.key-secret=

# PayU Hosted Checkout. Keep PAYU_ENABLED=false until PayU approves this business model.
payu.enabled=true
payu.environment=PRODUCTION
payu.merchant-key=aP0r8Q
payu.salt=Z64djeOOiup1ckUcclmXCLzST8thGen2
payu.public-base-url=http://localhost:8080
payu.customer-phone=${PAYU_CUSTOMER_PHONE:9999999999}
payu.connect-timeout=5s
payu.read-timeout=15s
payu.reconciliation.enabled=true
payu.reconciliation.fixed-delay-ms=300000
